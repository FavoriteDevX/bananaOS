<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bananaOS Sequoia</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Top Menu Bar -->
    <div class="menu-bar">
        <div class="menu-left">
            <span class="menu-item bnn-logo" onclick="toggleWindow('about-window')">🍌</span>
            <span class="menu-item bold">Banandler</span>
            <span class="menu-item">File</span>
            <span class="menu-item">Edit</span>
            <span class="menu-item">View</span>
            <span class="menu-item">Go</span>
            <span class="menu-item">Window</span>
            <span class="menu-item">Help</span>
        </div>
        <div class="menu-right">
            <span class="menu-item">📶</span>
            <span class="menu-item">100% 🔋</span>
            <span class="menu-item" id="current-time">Mon 9:41 AM</span>
        </div>
    </div>

    <!-- Desktop Area -->
    <div class="desktop" id="desktop">
        <!-- About This Banana Window -->
        <div class="window" id="about-window">
            <div class="window-header">
                <div class="window-buttons">
                    <span class="close-btn" onclick="toggleWindow('about-window')"></span>
                    <span class="minimize-btn"></span>
                    <span class="expand-btn"></span>
                </div>
                <div class="window-title">About This Banana</div>
            </div>
            <div class="window-content about-content">
                <div class="about-logo">🍌</div>
                <div class="about-specs">
                    <h2>bananaOS</h2>
                    <p class="version">Version 15.0 (Potassium Peak)</p>
                    <p><strong>MacBook Pro</strong> (16-inch, Bunch of 2026)</p>
                    <p><strong>Chip:</strong> Banana M4 Max Rich</p>
                    <p><strong>Memory:</strong> 24 GB Potassium RAM</p>
                    <p><strong>Graphics:</strong> Chiquita Pro GPU 16-Core</p>
                    <p class="serial">Serial Number: <span>B4N4N4M0RD1D4</span></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Full macOS style Dock with Fixed High-Visibility SVG Logos -->
    <div class="dock-container">
        <div class="dock">
            
            <!-- 1. Finder / Banandler (Yellow and White face) -->
            <div class="dock-item" title="Banandler (Finder)">
                <div class="dock-icon bnn-finder">
                    <svg viewBox="0 0 100 100" width="36" height="36">
                        <path d="M50,15 C25,15 15,25 15,50 C15,75 25,85 50,85 C75,85 85,75 85,50 C85,25 75,15 50,15 Z" fill="#FFFBEB"/>
                        <path d="M50,15 C34,15 32,35 32,50 C32,65 34,85 50,85" fill="none" stroke="#D97706" stroke-width="5.5"/>
                        <path d="M15,52 L85,52" fill="none" stroke="#D97706" stroke-width="5.5"/>
                        <circle cx="36" cy="38" r="5" fill="#D97706"/>
                        <circle cx="64" cy="38" r="5" fill="#D97706"/>
                        <path d="M40,66 Q50,74 60,66" fill="none" stroke="#D97706" stroke-width="5" stroke-linecap="round"/>
                    </svg>
                </div>
                <div class="dock-dot"></div>
            </div>

            <!-- 2. Safari / Bananari (White Compass) -->
            <div class="dock-item" title="Bananari (Safari)">
                <div class="dock-icon apple-safari">
                    <svg viewBox="0 0 100 100" width="34" height="34">
                        <circle cx="50" cy="50" r="38" fill="none" stroke="#ffffff" stroke-width="5"/>
                        <path d="M42,42 L64,24 L58,58 L36,76 Z" fill="#FF453A"/>
                        <path d="M42,42 L36,76 L58,58 Z" fill="#ffffff"/>
                        <circle cx="50" cy="50" r="3" fill="#ffffff"/>
                    </svg>
                </div>
            </div>

            <!-- 3. iBunch (Messages - Solid White Bubble) -->
            <div class="dock-item" title="iBunch (Messages)">
                <div class="dock-icon apple-messages">
                    <svg viewBox="0 0 100 100" width="32" height="32">
                        <path d="M50,18 C26,18 15,32 15,48 C15,58 22,68 32,73 L28,87 L44,81 C46,81 48,82 50,82 C74,82 85,68 85,48 C85,32 74,18 50,18 Z" fill="#ffffff"/>
                    </svg>
                </div>
            </div>

            <!-- 4. BananaMail (White Envelope) -->
            <div class="dock-item" title="BananaMail (Mail)">
                <div class="dock-icon apple-mail">
                    <svg viewBox="0 0 100 100" width="32" height="32">
                        <rect x="15" y="26" width="70" height="48" rx="6" fill="none" stroke="#ffffff" stroke-width="6"/>
                        <path d="M15,30 L50,56 L85,30" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
            </div>

            <!-- 5. Banana Music (White Notes) -->
            <div class="dock-item" title="Banana Music (Music)">
                <div class="dock-icon apple-music">
                    <svg viewBox="0 0 100 100" width="32" height="32">
                        <path d="M38,64 L38,22 L78,16 L78,56" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M38,34 L78,28" fill="none" stroke="#ffffff" stroke-width="6"/>
                        <circle cx="28" cy="64" r="10" fill="#ffffff"/>
                        <circle cx="68" cy="56" r="10" fill="#ffffff"/>
                    </svg>
                </div>
            </div>

            <!-- 6. App Store / Peel Store (White 'A' Lines) -->
            <div class="dock-item" title="Peel Store (App Store)">
                <div class="dock-icon bnn-store">
                    <svg viewBox="0 0 100 100" width="32" height="32">
                        <path d="M50,14 L50,86 M20,70 L80,32 M20,32 L80,70" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
                    </svg>
                </div>
            </div>

            <!-- 7. Photos / Bunch Photos (Multi-color flower overlay) -->
            <div class="dock-item" title="Bunch Photos (Photos)">
                <div class="dock-icon bnn-photos">
                    <svg viewBox="0 0 100 100" width="34" height="34">
                        <circle cx="50" cy="32" r="15" fill="#FF2D55" opacity="0.85"/>
                        <circle cx="50" cy="68" r="15" fill="#FF9500" opacity="0.85"/>
                        <circle cx="32" cy="50" r="15" fill="#4CD964" opacity="0.85"/>
                        <circle cx="72" cy="50" r="15" fill="#5AC8FA" opacity="0.85"/>
                    </svg>
                </div>
            </div>

            <!-- 8. Maps / Chiquita Maps (White grid map template) -->
            <div class="dock-item" title="Chiquita Maps (Maps)">
                <div class="dock-icon bnn-maps">
                    <svg viewBox="0 0 100 100" width="32" height="32">
                        <path d="M15,20 L42,14 L68,24 L85,18 L85,80 L68,86 L42,76 L15,82 Z" fill="none" stroke="#ffffff" stroke-width="5" stroke-linejoin="round"/>
                        <path d="M42,14 L42,76 M68,24 L68,86" stroke="#ffffff" stroke-width="4" stroke-dasharray="4"/>
                        <path d="M50,32 C42,32 42,50 50,62 C58,50 58,32 50,32 Z" fill="#FF3B30"/>
                        <circle cx="50" cy="42" r="3.5" fill="#ffffff"/>
                    </svg>
                </div>
            </div>

            <!-- 9. System Settings / Plantain Settings (Dark grey gear mechanics) -->
            <div class="dock-item" onclick="toggleWindow('about-window')" title="Plantain Settings">
                <div class="apple-settings dock-icon">
                    <svg viewBox="0 0 100 100" width="32" height="32">
                        <circle cx="50" cy="50" r="16" fill="none" stroke="#3a4454" stroke-width="6"/>
                        <path d="M50,12 L50,22 M50,78 L50,88 M12,50 L22,50 M78,50 L88,50 M24,24 L32,32 M68,68 L76,76 M24,78 L32,72 M68,32 L76,24" stroke="#3a4454" stroke-width="7" stroke-linecap="round"/>
                    </svg>
                </div>
            </div>

            <div class="dock-divider"></div>

            <!-- 10. Peel Trash (White metallic bin container) -->
            <div class="dock-item" title="Peel Trash (Trash)">
                <div class="dock-icon apple-trash">
                    <svg viewBox="0 0 100 100" width="32" height="32">
                        <path d="M25,32 L30,85 A4,4 0 0,0 34,89 L66,89 A4,4 0 0,0 70,85 L75,32 Z" fill="none" stroke="#ffffff" stroke-width="5"/>
                        <path d="M16,32 L84,32 M38,22 L62,22" fill="none" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round"/>
                        <path d="M44,46 L46,74 M56,46 L54,74" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
                    </svg>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
