<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bananaOS Sequoia</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Top Menu Bar -->
    <div class="menu-bar">
        <div class="menu-left">
            <span class="menu-item bnn-logo" onclick="toggleWindow('about-window')">🍌</span>
            <span class="menu-item bold">Banandler</span>
            <span class="menu-item">File</span>
            <span class="menu-item">Edit</span>
            <span class="menu-item">View</span>
            <span class="menu-item">Go</span>
            <span class="menu-item">Window</span>
            <span class="menu-item">Help</span>
        </div>
        <div class="menu-right">
            <span class="menu-item">📶</span>
            <span class="menu-item">100% 🔋</span>
            <span class="menu-item" id="current-time">Mon 9:41 AM</span>
        </div>
    </div>

    <!-- Desktop Area -->
    <div class="desktop" id="desktop">
        <!-- About This Banana Window -->
        <div class="window" id="about-window">
            <div class="window-header">
                <div class="window-buttons">
                    <span class="close-btn" onclick="toggleWindow('about-window')"></span>
                    <span class="minimize-btn"></span>
                    <span class="expand-btn"></span>
                </div>
                <div class="window-title">About This Banana</div>
            </div>
            <div class="window-content about-content">
                <div class="about-logo">🍌</div>
                <div class="about-specs">
                    <h2>bananaOS</h2>
                    <p class="version">Version 15.0 (Potassium Peak)</p>
                    <p><strong>MacBook Pro</strong> (16-inch, Bunch of 2026)</p>
                    <p><strong>Chip:</strong> Banana M4 Max Rich</p>
                    <p><strong>Memory:</strong> 24 GB Potassium RAM</p>
                    <p><strong>Graphics:</strong> Chiquita Pro GPU 16-Core</p>
                    <p class="serial">Serial Number: <span>B4N4N4M0RD1D4</span></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Full macOS style Dock with all Requested App Parodies -->
    <div class="dock-container">
        <div class="dock">
            
            <!-- 1. Finder / Banandler (Custom Yellow and White) -->
            <div class="dock-item" title="Banandler (Finder)">
                <div class="dock-icon bnn-finder">
                    <svg viewBox="0 0 100 100" width="34" height="34">
                        <path d="M50,15 C25,15 15,25 15,50 C15,75 25,85 50,85 C75,85 85,75 85,50 C85,25 75,15 50,15 Z" fill="#FFFBEB"/>
                        <path d="M50,15 C35,15 32,35 32,50 C32,65 38,85 50,85" fill="none" stroke="#FBBF24" stroke-width="5"/>
                        <path d="M25,52 L75,52" fill="none" stroke="#FBBF24" stroke-width="5" stroke-linecap="round"/>
                        <circle cx="38" cy="38" r="4.5" fill="#FBBF24"/>
                        <circle cx="62" cy="38" r="4.5" fill="#FBBF24"/>
                        <path d="M42,64 Q50,70 58,64" fill="none" stroke="#FBBF24" stroke-width="4.5" stroke-linecap="round"/>
                    </svg>
                </div>
                <div class="dock-dot"></div>
            </div>

            <!-- 2. Safari / Bananari -->
            <div class="dock-item" title="Bananari (Safari)">
                <div class="dock-icon apple-safari">
                    <svg viewBox="0 0 100 100" width="32" height="32">
                        <circle cx="50" cy="50" r="38" fill="none" stroke="white" stroke-width="4"/>
                        <path d="M44,44 L66,22 L56,56 L34,78 Z" fill="#FF453A"/>
                        <path d="M44,44 L34,78 L56,56 Z" fill="#ffffff" opacity="0.8"/>
                        <circle cx="50" cy="50" r="2.5" fill="white"/>
                    </svg>
                </div>
            </div>

            <!-- 3. iBunch (Messages) -->
            <div class="dock-item" title="iBunch (Messages)">
                <div class="dock-icon apple-messages">
                    <svg viewBox="0 0 100 100" width="30" height="30">
                        <path d="M18,48 C18,28 42,22 50,22 C74,22 82,36 82,48 C82,64 66,72 50,72 C46,72 38,75 28,79 C31,73 24,70 21,66 C16,59 18,54 18,48 Z" fill="white"/>
                    </svg>
                </div>
            </div>

            <!-- 4. BananaMail -->
            <div class="dock-item" title="BananaMail (Mail)">
                <div class="dock-icon apple-mail">
                    <svg viewBox="0 0 100 100" width="30" height="30">
                        <rect x="15" y="28" width="70" height="46" rx="6" fill="white" opacity="0.3"/>
                        <path d="M15,32 L50,56 L85,32" fill="none" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
                        <rect x="15" y="28" width="70" height="46" rx="6" fill="none" stroke="white" stroke-width="4"/>
                    </svg>
                </div>
            </div>

            <!-- 5. Banana Music -->
            <div class="dock-item" title="Banana Music (Music)">
                <div class="dock-icon apple-music">
                    <svg viewBox="0 0 100 100" width="30" height="30">
                        <path d="M35,68 L35,26 L75,20 L75,60" fill="none" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M35,36 L75,30" fill="none" stroke="white" stroke-width="5"/>
                        <circle cx="26" cy="68" r="9" fill="white"/>
                        <circle cx="66" cy="60" r="9" fill="white"/>
                    </svg>
                </div>
            </div>

            <!-- 6. App Store / Peel Store -->
            <div class="dock-item" title="Peel Store (App Store)">
                <div class="dock-icon bnn-store">
                    <svg viewBox="0 0 100 100" width="30" height="30">
                        <path d="M50,15 L50,85 M22,70 L78,32 M22,32 L78,70" stroke="white" stroke-width="7" stroke-linecap="round"/>
                    </svg>
                </div>
            </div>

            <!-- 7. Photos / Bunch Photos -->
            <div class="dock-item" title="Bunch Photos (Photos)">
                <div class="dock-icon bnn-photos">
                    <svg viewBox="0 0 100 100" width="34" height="34">
                        <ellipse cx="50" cy="28" rx="10" ry="20" fill="#FF2D55" opacity="0.8"/>
                        <ellipse cx="50" cy="72" rx="10" ry="20" fill="#FF9500" opacity="0.8"/>
                        <ellipse cx="28" cy="50" rx="20" ry="10" fill="#4CD964" opacity="0.8"/>
                        <ellipse cx="72" cy="50" rx="20" ry="10" fill="#5AC8FA" opacity="0.8"/>
                    </svg>
                </div>
            </div>

            <!-- 8. Maps / Chiquita Maps -->
            <div class="dock-item" title="Chiquita Maps (Maps)">
                <div class="dock-icon bnn-maps">
                    <svg viewBox="0 0 100 100" width="32" height="32">
                        <path d="M20,20 L45,15 L65,25 L80,20 L80,80 L65,85 L45,75 L20,80 Z" fill="none" stroke="white" stroke-width="4"/>
                        <path d="M45,15 L45,75 M65,25 L65,85" stroke="white" stroke-width="3" stroke-dasharray="4"/>
                        <path d="M50,35 C40,35 40,55 50,65 C60,55 60,35 50,35 Z" fill="#FF3B30"/>
                        <circle cx="50" cy="45" r="4" fill="white"/>
                    </svg>
                </div>
            </div>

            <!-- 9. System Settings / Plantain Settings -->
            <div class="dock-item" onclick="toggleWindow('about-window')" title="Plantain Settings">
                <div class="apple-settings dock-icon">
                    <svg viewBox="0 0 100 100" width="32" height="32">
                        <circle cx="50" cy="50" r="14" fill="none" stroke="#4a5568" stroke-width="5"/>
                        <path d="M50,12 L50,22 M50,78 L50,88 M12,50 L22,50 M78,50 L88,50 M24,24 L32,32 M68,68 L76,76 M24,78 L32,72 M68,32 L76,24" stroke="#4a5568" stroke-width="6" stroke-linecap="round"/>
                    </svg>
                </div>
            </div>

            <div class="dock-divider"></div>

            <!-- 10. Peel Trash -->
            <div class="dock-item" title="Peel Trash (Trash)">
                <div class="dock-icon apple-trash">
                    <svg viewBox="0 0 100 100" width="30" height="30">
                        <path d="M25,32 L30,85 A4,4 0 0,0 34,89 L66,89 A4,4 0 0,0 70,85 L75,32 Z" fill="none" stroke="white" stroke-width="4.5"/>
                        <path d="M18,32 L82,32 M38,22 L62,22" fill="none" stroke="white" stroke-width="5" stroke-linecap="round"/>
                        <path d="M44,44 L46,76 M56,44 L54,76" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
                    </svg>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
